<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantum DnD — Auth</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --danger: #f87171;
      --success: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: var(--panel);
      border-radius: 1rem;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
    .subtitle { color: var(--muted); margin-bottom: 1.5rem; }
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .tab {
      flex: 1;
      background: transparent;
      border: 1px solid var(--muted);
      color: var(--text);
      padding: 0.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 500;
    }
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0f172a;
    }
    .form { display: none; }
    .form.active { display: block; }
    label {
      display: block;
      margin-bottom: 0.25rem;
      font-size: 0.875rem;
      color: var(--muted);
    }
    input {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    button[type="submit"] {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 0.5rem;
      background: var(--accent);
      color: #0f172a;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button[type="submit"]:hover { background: var(--accent-hover); }
    .message {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      display: none;
    }
    .message.error { background: rgba(248, 113, 113, 0.15); color: var(--danger); display: block; }
    .message.success { background: rgba(52, 211, 153, 0.15); color: var(--success); display: block; }
    .dashboard { display: none; text-align: center; }
    .dashboard.active { display: block; }
    .dashboard h2 { margin-top: 0; }
    .dashboard .actions { display: flex; gap: 0.5rem; margin-top: 1.5rem; }
    .dashboard .actions button { flex: 1; }
    .secondary {
      background: transparent;
      border: 1px solid var(--muted);
      color: var(--text);
      padding: 0.75rem;
      border-radius: 0.5rem;
      cursor: pointer;
    }
    .secondary:hover { border-color: var(--text); }
  </style>
</head>
<body>
  <div class="card">
    <div id="authForms">
      <h1>Quantum DnD</h1>
      <p class="subtitle">Sign in to save and share your circuits.</p>

      <div class="tabs">
        <button class="tab active" data-tab="login">Sign in</button>
        <button class="tab" data-tab="register">Create account</button>
      </div>

      <form id="loginForm" class="form active" data-form="login">
        <label for="loginUsername">Username</label>
        <input id="loginUsername" type="text" required minlength="3" maxlength="32" autocomplete="username" />

        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" required minlength="8" autocomplete="current-password" />

        <button type="submit">Sign in</button>
      </form>

      <form id="registerForm" class="form" data-form="register">
        <label for="registerUsername">Username</label>
        <input id="registerUsername" type="text" required minlength="3" maxlength="32" autocomplete="username" />

        <label for="registerPassword">Password</label>
        <input id="registerPassword" type="password" required minlength="8" autocomplete="new-password" />

        <label for="registerConfirm">Confirm password</label>
        <input id="registerConfirm" type="password" required minlength="8" autocomplete="new-password" />

        <button type="submit">Create account</button>
      </form>

      <div id="message" class="message"></div>
    </div>

    <div id="dashboard" class="dashboard">
      <h1>Welcome back</h1>
      <p id="userDisplay" class="subtitle"></p>
      <div class="actions">
        <button id="appBtn" class="secondary" type="button">Open Quantum DnD</button>
        <button id="logoutBtn" class="secondary" type="button">Sign out</button>
      </div>
    </div>
  </div>

  <script>
    const messageEl = document.getElementById('message');
    const authForms = document.getElementById('authForms');
    const dashboard = document.getElementById('dashboard');
    const userDisplay = document.getElementById('userDisplay');
    const appBtn = document.getElementById('appBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
    }

    function clearMessage() {
      messageEl.textContent = '';
      messageEl.className = 'message';
    }

    function showDashboard(user) {
      authForms.style.display = 'none';
      dashboard.classList.add('active');
      userDisplay.textContent = `Signed in as @${user.username}`;
    }

    function showAuth() {
      authForms.style.display = 'block';
      dashboard.classList.remove('active');
    }

    async function api(method, path, body) {
      const options = {
        method,
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
      };
      if (body) options.body = JSON.stringify(body);
      const res = await fetch(path, options);
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, status: res.status, data };
    }

    async function checkSession() {
      const { ok, data } = await api('GET', '/auth/me');
      if (ok && data.user) {
        showDashboard(data.user);
      } else {
        showAuth();
      }
    }

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        const formName = tab.dataset.tab;
        document.querySelectorAll('.form').forEach((f) => f.classList.remove('active'));
        document.querySelector(`.form[data-form="${formName}"]`).classList.add('active');
        clearMessage();
      });
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessage();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const { ok, data } = await api('POST', '/auth/login', { username, password });
      if (ok && data.user) {
        showDashboard(data.user);
      } else {
        showMessage(data.error || 'Sign in failed', 'error');
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessage();
      const username = document.getElementById('registerUsername').value.trim();
      const password = document.getElementById('registerPassword').value;
      const confirm = document.getElementById('registerConfirm').value;
      if (password !== confirm) {
        showMessage('Passwords do not match', 'error');
        return;
      }
      const { ok, data } = await api('POST', '/auth/register', { username, password });
      if (ok && data.user) {
        showDashboard(data.user);
      } else {
        showMessage(data.error || 'Registration failed', 'error');
      }
    });

    appBtn.addEventListener('click', () => {
      window.location.href = '/';
    });

    logoutBtn.addEventListener('click', async () => {
      await api('POST', '/auth/logout');
      showAuth();
      clearMessage();
      document.getElementById('loginForm').reset();
    });

    checkSession();
  </script>
</body>
</html>
