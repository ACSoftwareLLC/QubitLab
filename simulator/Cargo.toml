[package]
name = "quantum-dnd-simulator"
version = "0.1.0"
edition = "2021"
description = "Quantum-Dnd statevector simulator, compiled to WASM for in-browser execution"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"

[dev-dependencies]
rand_chacha = "0.9"

[profile.release]
opt-level = 3
lto = true
